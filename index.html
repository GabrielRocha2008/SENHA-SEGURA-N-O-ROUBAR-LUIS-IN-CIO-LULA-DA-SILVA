<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo">
        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="cadeado fechado">
            <h2 class="titulo-principal">Gerador de senhas</h2>
            <h3 class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</h3>
        </div>
        <div class="conteudo-senha">
            <label for="senha">Senha</label>
            <input name="senha" type="text" id="campo-senha">
        </div>
        <div class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Número de caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao">-</button>
                        <p class="parametro-senha__texto">12</p>
                        <button class="parametro-senha__botao">+</button>
                    </div>
                </div>               
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Características da senha</h4>
                <div class="parametro-senha__titulo">
                        <input name="maiores" type="checkbox" class="checkbox" checked>
                    <label for="maiores">Letras grandes de maiores</label>
                </div>
                <div class="parametro-senha-checkbox">
                    <input name="piquininim" type="checkbox" class="checkbox">
                    <label for="piquininim">Letras minusculas di piquininim</label>
                </div>
                <div class="parametro-senha-checkbox">
                    <input name="numerus" type="checkbox" class="checkbox">
                    <label for="numerus">numerus numberosos</label>
                </div>
                <div class="parametro-senha-checkbox">
                    <input name="simbrulu" type="checkbox" class="checkbox">
                    <label for="simbrulu">simbrulu dus desenho lá</label>
                </div>

            
                </div>
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Força da senha</h4>
                    <div class="barra"></div>
                    <div class="fraca"></div>
                    <div class="parametro-senhas-textos"></div>
                    <p>Fernando até as 3h da manhã jogando</p>
                    <p>Fernando até as 22h da noite jogando</p>
                    <p>Fernando dormindo certo</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>

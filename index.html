<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="conteudo">
        <header class="conteudo-titulo">
            <img src="unlock.svg" alt="Ícone de cadeado aberto">
            <h1 class="titulo-principal">Gerador de senhas</h1>
            <h2 class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura</h2>
        </header>

        <!-- Campo onde a senha gerada será exibida -->
        <section class="conteudo-senha">
            <label for="campo-senha">Senha Gerada</label>
            <div class="input-container">
                <input type="text" id="campo-senha" readonly placeholder="Clique em Gerar">
                <button id="btn-copiar" title="Copiar Senha">Copiar</button>
            </div>
        </section>

        <!-- Configurações do Gerador -->
        <section class="parametro">
            <h3 class="parametro-titulo">Personalize sua senha</h3>
            
            <div class="parametro-coluna__senha">
                <!-- Controle de Tamanho -->
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Número de caracteres</h4>
                    <div class="parametro-senha-botoes">
                        <button type="button" class="parametro-senha__botao" id="btn-menos">-</button>
                        <span class="parametro-senha__texto" id="contador-caracteres">12</span>
                        <button type="button" class="parametro-senha__botao" id="btn-mais">+</button>
                    </div>
                </div>               

                <!-- Opções de Tipo de Caractere -->
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Características da senha</h4>
                    
                    <div class="parametro-senha-checkbox">
                        <input name="maiores" type="checkbox" id="chk-maiusculas" class="checkbox" checked>
                        <label for="chk-maiusculas">Letras maiúsculas (A-Z)</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="minisculas" type="checkbox" id="chk-minusculas" class="checkbox" checked>
                        <label for="chk-minusculas">Letras minúsculas (a-z)</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="numeros" type="checkbox" id="chk-numeros" class="checkbox" checked>
                        <label for="chk-numeros">Números (0-9)</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="simbolos" type="checkbox" id="chk-simbolos" class="checkbox">
                        <label for="chk-simbolos">Símbolos (!@#$%^&*)</label>
                    </div>
                </div>

                <!-- Medidor de Força da Senha -->
                <div class="parametro-senha">
                    <h4 class="parametro-senha__titulo">Força da senha</h4>
                    <div class="barra-forca-container">
                        <div id="barra-forca" class="forca-media"></div>
                    </div>
                    <div class="parametro-senhas-textos">
                        <span id="texto-forca">Média</span>
                    </div>
                </div>
            </div>

            <!-- Botão de Ação Principal -->
            <button type="button" id="btn-gerar" class="botao-gerar">Gerar Senha</button>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
